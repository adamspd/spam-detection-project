# This workflow will install Python dependencies and run tests across the range of
# Python versions this package supports.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: tests

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # xgboost 3.3+ requires Python 3.12 or newer.
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Download NLTK Data
      run: |
        python -m nltk.downloader stopwords
        python -m nltk.downloader wordnet
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest
        python -m unittest spam_detector_ai.tests.test_dataloader
        python -m unittest spam_detector_ai.tests.test_preprocessor

  # Merge Dependabot patch and minor updates once the tests pass.
  # Major updates stay open for a manual review, except setuptools.
  # setuptools bumps its major version often and is only a build tool.
  # numpy is pinned on purpose (see requirements.txt), so its updates are
  # left for review too.
  automerge:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - if: (steps.meta.outputs.update-type != 'version-update:semver-major' || steps.meta.outputs.dependency-names == 'setuptools') && !contains(steps.meta.outputs.dependency-names, 'numpy')
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
