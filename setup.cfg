[metadata]
license = MIT
license_files = LICENSE
classifiers =
    Environment :: Console
    Intended Audience :: Developers
    Operating System :: OS Independent
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Topic :: Text Processing
    Topic :: Scientific/Engineering :: Artificial Intelligence

[options]
include_package_data = true
packages =
    spam_detector_ai
    spam_detector_ai.models
    spam_detector_ai.models.svm
    spam_detector_ai.models.bayes
    spam_detector_ai.models.random_forest
    spam_detector_ai.models.xgb
    spam_detector_ai.models.logistic_regression
    spam_detector_ai.training
    spam_detector_ai.classifiers
    spam_detector_ai.loading_and_processing
    spam_detector_ai.prediction
    spam_detector_ai.tests
    spam_detector_ai.tuning

python_requires = >=3.11
install_requires =
    scikit-learn>=1.7.0,<2.0.0
    imbalanced-learn>=0.14.0,<0.15.0
    pandas>=2.3.0,<4.0.0
    nltk>=3.9.0,<4.0.0
    joblib>=1.5.0,<2.0.0
    xgboost>=3.1.0,<4.0.0
    numpy==2.4.6

[options.package_data]
spam_detector_ai = models/*/*

[tool:pytest]
# joblib < 1.6 uses deprecated array.shape assignment path in NumPy 2.5+
# which silently corrupts ComplementNB arrays on load (https://github.com/joblib/joblib/issues/1772).
# The joblib fix (joblib/joblib#1777) targets joblib 1.6.0, not yet released.
# Revisit once that ships or try upgrading after joblib 1.6.
filterwarnings =
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning
